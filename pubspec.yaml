name: monitor_app
description: LocalBus para celulares, igual al mapa de la página web (invitados y pasajeros)
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  shared_preferences: ^2.3.0
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^23.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  # Tipografías del sitio web de LocalBus (docs/GUIA_DE_DISENO.md, sección 4).
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700